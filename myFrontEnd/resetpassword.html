<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <title>Reset password</title>
</head>

<body>
    <main class="auth-container single-auth">
        <section class="auth-card login-card">
            <h1>Reset Password</h1>
            <div class="subtitle">Create a new password for your account</div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" name="password" placeholder="Enter a new password"
                        autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm your new password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="login-button">Reset password</button>
                <span id="message" class="form-message"></span>
            </form>

            <p class="auth-footer"><a href="../index.html">Back to login</a></p>
        </section>
    </main>
    <script type="module" src="../js/reset-password.js"></script>
</body>

</html>
