<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Create your account</title>
</head>

<body>

    <main class="auth-container single-auth">
        <section class="auth-card signup-card">
            <h1>Create an account</h1>
            <div class="subtitle">Sign up to get started</div>


            <form id="signupForm" class="signup-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" name="email" placeholder="Enter your E-mail"
                            autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" name="username" placeholder="Choose a username"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupFullname">Full Name</label>
                    <input type="text" id="signupFullname" name="fullname" placeholder="Enter your Full Name"
                        autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <div class="gender-options">
                        <label class="radio-option" for="genderMale">
                            <input type="radio" id="genderMale" name="gender" value="male" required>
                            <span>Male</span>
                        </label>
                        <label class="radio-option" for="genderFemale">
                            <input type="radio" id="genderFemale" name="gender" value="female">
                            <span>Female</span>
                        </label>
                        <label class="radio-option" for="genderOthers">
                            <input type="radio" id="genderOthers" name="gender" value="others">
                            <span>Others</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" name="password" placeholder="Create a password"
                        autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm your password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="signup-button">Create account</button>
                <p id="message" class="form-message"></p>
            </form>

            <div class="form-divider">
                <span>or continue with</span>
            </div>

            <div class="social-buttons">
                <button type="button" class="social-button">
                    <svg class="brand-logo google-logo" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4"
                            d="M21.35 12.27c0-.78-.07-1.53-.22-2.25H12v4.26h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.4Z" />
                        <path fill="#34A853"
                            d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.75Z" />
                        <path fill="#FBBC05"
                            d="M6.54 13.84a5.86 5.86 0 0 1 0-3.68V7.63H3.3a9.75 9.75 0 0 0 0 8.74l3.24-2.53Z" />
                        <path fill="#EA4335"
                            d="M12 6.13c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.23 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 7.85 9.46 6.13 12 6.13Z" />
                    </svg>
                    <span>Sign up with Google</span>
                </button>
                <button type="button" class="social-button">
                    <svg class="brand-logo github-logo" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 2.25a9.75 9.75 0 0 0-3.08 19c.49.09.67-.21.67-.47v-1.66c-2.73.59-3.31-1.16-3.31-1.16-.44-1.11-1.06-1.41-1.06-1.41-.87-.6.07-.59.07-.59.96.07 1.47.99 1.47.99.86 1.47 2.25 1.05 2.8.8.09-.62.34-1.05.61-1.29-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.94.99-2.62-.1-.24-.43-1.24.09-2.58 0 0 .81-.26 2.68 1a9.3 9.3 0 0 1 4.88 0c1.86-1.26 2.67-1 2.67-1 .52 1.34.19 2.34.1 2.58.61.68.98 1.55.98 2.62 0 3.77-2.29 4.6-4.48 4.84.35.3.66.89.66 1.8v2.67c0 .26.18.56.68.46A9.75 9.75 0 0 0 12 2.25Z" />
                    </svg>
                    <span>Sign up with GitHub</span>
                </button>
            </div>

            <p class="auth-footer">Already have an account? <a href="index.html">Log in</a></p>
        </section>
    </main>
    <script type="module" src="js/signup.js">
    </script>
</body>

</html>
