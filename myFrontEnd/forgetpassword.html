<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <title>Forgot password</title>
</head>

<body>
    <main class="auth-container single-auth">
        <section class="auth-card login-card">
            <h1>Forgot Password?</h1>
            <div class="subtitle">Enter your email to reset your password</div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input type="email" id="resetEmail" name="email" placeholder="Enter your email" autocomplete="email"
                        required>
                </div>

                <button type="submit" class="login-button">Send reset link</button>
                <p id="forgotPasswordMessage"></p>
            </form>

            <p class="auth-footer"><a href="../index.html">Back to login</a></p>
        </section>
    </main>
    <script type="module" src="js/forgot-password.js"></script>
</body>

</html>
